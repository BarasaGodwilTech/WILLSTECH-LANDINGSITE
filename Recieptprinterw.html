<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will's Tech Store - Receipt Printer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 10px;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            background: #2563eb;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .card-title {
            color: #2563eb;
            font-size: 1.2rem;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #374151;
        }
        
        .form-control {
            width: 100%;
            padding: 10px;
            border: 2px solid #d1d5db;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 10px;
            justify-content: center;
        }
        
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .printer-status {
            padding: 12px;
            border-radius: 5px;
            margin: 15px 0;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-connected {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }
        
        .status-disconnected {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }
        
        /* Receipt Preview - Optimized for 58mm */
        .receipt-paper {
            width: 100%;
            max-width: 280px;
            background: white;
            border: 1px solid #d1d5db;
            padding: 20px 15px;
            margin: 0 auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.2;
            position: relative;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .printer-option {
            padding: 15px;
            border: 2px solid #d1d5db;
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .printer-option.selected {
            border-color: #2563eb;
            background: #dbeafe;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #10b981;
            color: white;
            border-radius: 5px;
            display: none;
            z-index: 1001;
        }
        
        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        .toast.error {
            background: #ef4444;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        
        /* Responsive */
        @media (min-width: 768px) {
            .container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            
            .header {
                grid-column: 1 / -1;
            }
            
            .btn {
                width: auto;
                margin-right: 10px;
            }
            
            .btn-group {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-store"></i> Will's Tech Store</h1>
            <p>Receipt Printing System - willstech.store</p>
        </div>
        
        <div class="card">
            <h2 class="card-title"><i class="fas fa-store-alt"></i> Store Info</h2>
            <div class="form-group">
                <label class="form-label">Store Name</label>
                <input type="text" id="storeName" class="form-control" value="Will's Tech Store">
            </div>
            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="text" id="storePhone" class="form-control" value="+256 700 123 456">
            </div>
        </div>
        
        <div class="card">
            <h2 class="card-title"><i class="fas fa-receipt"></i> Receipt Details</h2>
            <div class="form-group">
                <label class="form-label">Customer Name</label>
                <input type="text" id="customerName" class="form-control" placeholder="Enter customer name">
            </div>
            <div class="form-group">
                <label class="form-label">Payment Method</label>
                <select id="paymentMethod" class="form-control">
                    <option value="Cash">Cash</option>
                    <option value="Mobile Money">Mobile Money</option>
                </select>
            </div>
            
            <div id="printerStatus" class="printer-status status-disconnected">
                <i class="fas fa-print"></i>
                <span>Printer: Not Connected</span>
            </div>
            
            <div class="btn-group">
                <button id="selectPrinter" class="btn btn-primary">
                    <i class="fas fa-bluetooth"></i> Select Printer
                </button>
                <button id="testPrint" class="btn btn-success" disabled>
                    <i class="fas fa-print"></i> Test Print
                </button>
            </div>
        </div>
        
        <div class="card">
            <h2 class="card-title"><i class="fas fa-shopping-cart"></i> Items (UGX)</h2>
            <div id="itemsContainer"></div>
            <button id="addItem" class="btn btn-primary">
                <i class="fas fa-plus"></i> Add Item
            </button>
        </div>
        
        <div class="card">
            <h2 class="card-title"><i class="fas fa-cogs"></i> Actions</h2>
            <div class="btn-group">
                <button id="printReceipt" class="btn btn-success">
                    <i class="fas fa-print"></i> Print Receipt
                </button>
                <button id="previewReceipt" class="btn btn-primary">
                    <i class="fas fa-eye"></i> Preview
                </button>
                <button id="clearAll" class="btn btn-danger">
                    <i class="fas fa-redo"></i> Clear
                </button>
            </div>
        </div>
        
        <div class="card" style="grid-column: 1 / -1;">
            <h2 class="card-title"><i class="fas fa-eye"></i> Receipt Preview</h2>
            <div id="receiptPreview" class="receipt-paper"></div>
        </div>
    </div>
    
    <!-- Printer Modal -->
    <div id="printerModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Select Printer Method</h3>
                <button id="closeModal" style="background: none; border: none; font-size: 24px; cursor: pointer;">&times;</button>
            </div>
            
            <div class="printer-option" data-method="usb-network">
                <i class="fas fa-print"></i>
                <strong>System Printer</strong>
                <p>Print using your system printer</p>
            </div>
            
            <div id="bluetoothOption" class="printer-option" data-method="web-bluetooth">
                <i class="fas fa-bluetooth"></i>
                <strong>Bluetooth Printer</strong>
                <p>Connect to Bluetooth thermal printer</p>
            </div>
            
            <button id="confirmMethod" class="btn btn-success" style="margin-top: 20px;">
                <i class="fas fa-check"></i> Use Selected Method
            </button>
        </div>
    </div>
    
    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // Toast function
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // Generate receipt number
        function generateReceiptNumber() {
            const now = new Date();
            const year = now.getFullYear().toString().slice(-2);
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const random = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
            
            return `RCT-UG-${now.getFullYear()}${month}${day}-${random}`;
        }
        
        // Generate transaction ID
        function generateTransactionId() {
            const now = new Date();
            const timestamp = now.getTime().toString().slice(-8);
            const random = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
            return `TXN${timestamp}${random}`;
        }
        
        // Format currency
        function formatUGX(amount) {
            return new Intl.NumberFormat('en-UG', {
                style: 'currency',
                currency: 'UGX',
                minimumFractionDigits: 0
            }).format(amount);
        }
        
        // Global variables
        let selectedPrinterMethod = null;
        let bluetoothDevice = null;
        let receiptItems = [];
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            initializeReceipt();
            setupEventListeners();
        });
        
        function initializeReceipt() {
            // Start with one empty item row
            addEmptyItem();
            updateReceiptPreview();
        }
        
        function setupEventListeners() {
            // Printer modal
            document.getElementById('selectPrinter').addEventListener('click', () => {
                document.getElementById('printerModal').style.display = 'block';
            });
            
            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('printerModal').style.display = 'none';
            });
            
            // Printer selection
            document.querySelectorAll('.printer-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.printer-option').forEach(o => {
                        o.classList.remove('selected');
                    });
                    this.classList.add('selected');
                    selectedPrinterMethod = this.dataset.method;
                });
            });
            
            // Confirm method
            document.getElementById('confirmMethod').addEventListener('click', function() {
                if (!selectedPrinterMethod) {
                    showToast('Please select a method first', 'error');
                    return;
                }
                
                document.getElementById('printerModal').style.display = 'none';
                
                const statusDiv = document.getElementById('printerStatus');
                const testBtn = document.getElementById('testPrint');
                const printBtn = document.getElementById('printReceipt');
                
                if (selectedPrinterMethod === 'usb-network') {
                    statusDiv.className = 'printer-status status-connected';
                    statusDiv.innerHTML = '<i class="fas fa-check-circle"></i><span>Ready for printing</span>';
                    testBtn.disabled = false;
                    printBtn.disabled = false;
                    showToast('Ready to print!');
                } else if (selectedPrinterMethod === 'web-bluetooth') {
                    connectBluetooth();
                }
            });
            
            // Add item
            document.getElementById('addItem').addEventListener('click', () => {
                addEmptyItem();
            });
            
            // Print receipt - FIXED: Added proper event listener
            document.getElementById('printReceipt').addEventListener('click', function() {
                console.log('Print Receipt button clicked');
                printReceipt();
            });
            
            // Test print
            document.getElementById('testPrint').addEventListener('click', testPrint);
            
            // Preview
            document.getElementById('previewReceipt').addEventListener('click', updateReceiptPreview);
            
            // Clear
            document.getElementById('clearAll').addEventListener('click', () => {
                if (confirm('Clear all items?')) {
                    receiptItems = [];
                    document.getElementById('itemsContainer').innerHTML = '';
                    addEmptyItem();
                    showToast('Cleared all items');
                }
            });
            
            // Auto-update preview
            ['storeName', 'storePhone', 'customerName', 'paymentMethod'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateReceiptPreview);
            });
        }
        
        function addEmptyItem() {
            const item = {
                id: Date.now(),
                name: '',
                quantity: 1,
                price: 0,
                total: 0
            };
            
            receiptItems.push(item);
            renderItems();
            updateReceiptPreview();
        }
        
        async function connectBluetooth() {
            const statusDiv = document.getElementById('printerStatus');
            const testBtn = document.getElementById('testPrint');
            const printBtn = document.getElementById('printReceipt');
            
            try {
                if (!navigator.bluetooth) {
                    showToast('Bluetooth not supported', 'error');
                    return;
                }
                
                statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Searching for printers...</span>';
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
                });
                
                statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Connecting...</span>';
                
                const server = await bluetoothDevice.gatt.connect();
                
                statusDiv.className = 'printer-status status-connected';
                statusDiv.innerHTML = '<i class="fas fa-check-circle"></i><span>Connected to printer</span>';
                testBtn.disabled = false;
                printBtn.disabled = false;
                
                showToast('Bluetooth printer connected!');
                
                // Handle disconnection
                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    statusDiv.className = 'printer-status status-disconnected';
                    statusDiv.innerHTML = '<i class="fas fa-times-circle"></i><span>Printer disconnected</span>';
                    testBtn.disabled = true;
                    printBtn.disabled = true;
                    showToast('Printer disconnected', 'error');
                });
                
            } catch (error) {
                console.error('Bluetooth error:', error);
                statusDiv.className = 'printer-status status-disconnected';
                statusDiv.innerHTML = '<i class="fas fa-times-circle"></i><span>Not connected</span>';
                showToast('Bluetooth connection failed', 'error');
            }
        }
        
        function renderItems() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';
            
            receiptItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'form-group';
                div.style.display = 'grid';
                div.style.gridTemplateColumns = '2fr 1fr 1fr 1fr auto';
                div.style.gap = '5px';
                div.style.marginBottom = '10px';
                
                div.innerHTML = `
                    <input type="text" class="form-control" value="${item.name}" 
                           data-index="${index}" placeholder="Item name" style="font-size: 14px; padding: 8px;">
                    <input type="number" class="form-control" value="${item.quantity}" 
                           data-index="${index}" min="1" placeholder="Qty" style="font-size: 14px; padding: 8px;">
                    <input type="number" class="form-control" value="${item.price}" 
                           data-index="${index}" step="1000" placeholder="Price" style="font-size: 14px; padding: 8px;">
                    <input type="text" class="form-control" value="${formatUGX(item.total)}" readonly 
                           style="font-size: 14px; padding: 8px; background-color: #f9fafb;">
                    <button class="btn btn-danger" data-index="${index}" 
                            style="padding: 8px; min-width: 40px;">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                
                container.appendChild(div);
            });
            
            // Add event listeners
            document.querySelectorAll('input[data-index]').forEach(input => {
                input.addEventListener('input', function() {
                    const index = parseInt(this.dataset.index);
                    updateItem(index);
                });
            });
            
            document.querySelectorAll('button[data-index]').forEach(button => {
                button.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    receiptItems.splice(index, 1);
                    if (receiptItems.length === 0) {
                        addEmptyItem();
                    } else {
                        renderItems();
                    }
                    updateReceiptPreview();
                });
            });
        }
        
        function updateItem(index) {
            const inputs = document.querySelectorAll(`input[data-index="${index}"]`);
            if (inputs.length < 3) return;
            
            receiptItems[index] = {
                ...receiptItems[index],
                name: inputs[0].value,
                quantity: parseInt(inputs[1].value) || 0,
                price: parseInt(inputs[2].value) || 0,
                total: (parseInt(inputs[1].value) || 0) * (parseInt(inputs[2].value) || 0)
            };
            
            if (inputs[3]) {
                inputs[3].value = formatUGX(receiptItems[index].total);
            }
            
            updateReceiptPreview();
        }
        
        function updateReceiptPreview() {
            const preview = document.getElementById('receiptPreview');
            const now = new Date();
            const receiptNumber = generateReceiptNumber();
            const transactionId = generateTransactionId();
            const subtotal = receiptItems.reduce((sum, item) => sum + item.total, 0);
            const vat = Math.round(subtotal * 0.18);
            const total = subtotal + vat;
            
            let itemsContent = '';
            if (receiptItems.length > 0) {
                itemsContent = receiptItems.map(item => `
                    <tr>
                        <td style="padding: 1px 0;">${item.name || 'Item'}</td>
                        <td style="text-align: right; padding: 1px 0;">${item.quantity}</td>
                        <td style="text-align: right; padding: 1px 0;">${formatUGX(item.total)}</td>
                    </tr>
                `).join('');
            } else {
                itemsContent = '<tr><td colspan="3" style="text-align: center; padding: 10px 0;">No items added</td></tr>';
            }
            
            preview.innerHTML = `
                <div style="text-align: center; margin-bottom: 8px; padding-top: 5px;">
                    <div style="font-weight: bold; font-size: 14px; margin-bottom: 3px; letter-spacing: 0.5px;">${document.getElementById('storeName').value}</div>
                    <div style="font-size: 9px; margin-bottom: 1px;">Tech Store & Services</div>
                    <div style="font-size: 9px;">Kampala Road, Kampala, Uganda</div>
                    <div style="font-size: 9px; margin-top: 2px;">${document.getElementById('storePhone').value}</div>
                </div>
                
                <div style="border-top: 1px dashed #000; border-bottom: 1px dashed #000; 
                     padding: 4px 0; margin: 6px 0;">
                    <div style="text-align: center; font-size: 12px; font-weight: bold; letter-spacing: 1px;">SALES RECEIPT</div>
                </div>
                
                <div style="font-size: 9px; margin: 6px 0; line-height: 1.3;">
                    <div style="margin-bottom: 2px;"><strong>Date:</strong> ${now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
                    <div style="margin-bottom: 2px;"><strong>Time:</strong> ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</div>
                    <div style="margin-bottom: 2px;"><strong>Receipt No:</strong> ${receiptNumber}</div>
                    <div style="margin-bottom: 2px;"><strong>Txn ID:</strong> ${transactionId}</div>
                    <div style="margin-bottom: 2px;"><strong>Customer:</strong> ${document.getElementById('customerName').value || 'Walk-in Customer'}</div>
                </div>
                
                <div style="border-bottom: 1px dashed #000; margin: 8px 0;"></div>
                
                <div style="font-size: 9px; margin: 5px 0;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 3px; font-weight: bold;">
                        <span>ITEM</span>
                        <span style="text-align: right;">QTY</span>
                        <span style="text-align: right;">AMOUNT</span>
                    </div>
                </div>
                
                <div style="font-size: 9px; margin: 5px 0;">
                    ${receiptItems.filter(item => item.name && item.price > 0).map(item => `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                            <span style="flex: 2;">${item.name}</span>
                            <span style="flex: 1; text-align: right; padding-right: 10px;">${item.quantity}</span>
                            <span style="flex: 1; text-align: right;">${formatUGX(item.total)}</span>
                        </div>
                    `).join('')}
                    
                    ${receiptItems.filter(item => item.name && item.price > 0).length === 0 ? 
                        '<div style="text-align: center; padding: 10px 0; font-size: 9px; color: #666;">No items added</div>' : ''}
                </div>
                
                ${receiptItems.filter(item => item.name && item.price > 0).length > 0 ? `
                <div style="border-bottom: 1px dashed #000; margin: 8px 0;"></div>
                
                <div style="font-size: 10px; margin: 8px 0;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 3px;">
                        <span>Subtotal:</span>
                        <span style="font-weight: bold;">${formatUGX(subtotal)}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 3px;">
                        <span>VAT (18%):</span>
                        <span>${formatUGX(vat)}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: 6px; padding-top: 6px; border-top: 1px solid #000;">
                        <span style="font-weight: bold;">TOTAL:</span>
                        <span style="font-weight: bold; font-size: 11px;">${formatUGX(total)}</span>
                    </div>
                </div>
                ` : ''}
                
                <div style="border-bottom: 1px dashed #000; margin: 8px 0;"></div>
                
                <div style="text-align: center; margin-top: 15px; margin-bottom: 10px; font-size: 9px; line-height: 1.3;">
                    <div style="margin-bottom: 4px;"><strong>Payment:</strong> ${document.getElementById('paymentMethod').value}</div>
                    <div style="color: green; font-weight: bold; margin-bottom: 8px; font-size: 10px;">✓ TRANSACTION SUCCESSFUL</div>
                    <div style="font-weight: bold; margin-bottom: 3px; font-size: 10px;">THANK YOU FOR SHOPPING WITH US!</div>
                    <div style="margin-bottom: 2px;">${document.getElementById('storeName').value}</div>
                    <div>Tel: ${document.getElementById('storePhone').value}</div>
                </div>
                
                <!-- Footer -->
                <div style="text-align: center; margin-top: 15px; font-size: 8px; color: #666; line-height: 1.2;">
                    <div style="margin-bottom: 3px;">For inquiries call: ${document.getElementById('storePhone').value}</div>
                    <div style="margin-bottom: 3px;">Email: info@willstech.store</div>
                    <div style="margin-bottom: 5px;">Website: willstech.store</div>
                    <div>*********************</div>
                </div>
                
                <!-- Tear-off space -->
                <div style="border-top: 1px dashed #ccc; margin-top: 20px; padding-top: 10px; text-align: center; font-size: 8px; color: #666;">
                    --- Tear here ---
                </div>
            `;
        }
        
        function testPrint() {
            if (!selectedPrinterMethod) {
                showToast('Select printer method first', 'error');
                return;
            }
            
            if (selectedPrinterMethod === 'usb-network') {
                printTestReceiptViaSystem();
            } else if (selectedPrinterMethod === 'web-bluetooth') {
                printTestReceiptViaBluetooth();
            }
        }
        
        function printReceipt() {
            console.log('printReceipt function called');
            console.log('Selected printer method:', selectedPrinterMethod);
            console.log('Receipt items count:', receiptItems.length);
            
            if (!selectedPrinterMethod) {
                showToast('Select printer method first', 'error');
                console.log('No printer method selected');
                return;
            }
            
            // Filter out empty items
            const validItems = receiptItems.filter(item => {
                // Keep items that have a name AND a price > 0
                return item.name && item.name.trim() !== '' && item.price > 0;
            });
            
            if (validItems.length === 0) {

        async function printReceiptViaBluetooth() {
            if (!bluetoothDevice) {
                showToast('Bluetooth printer not connected', 'error');
                return;
            }
            
            try {
                // Filter out empty items for Bluetooth printing
                const itemsToPrint = receiptItems.filter(item => {
                    return item.name && item.name.trim() !== '' && item.price > 0;
                });
                
                if (itemsToPrint.length === 0) {
                    showToast('No valid items to print', 'error');
                    return;
                }
                
                const now = new Date();
                const receiptNumber = generateReceiptNumber();
                const transactionId = generateTransactionId();
                const subtotal = itemsToPrint.reduce((sum, item) => sum + item.total, 0);
                const vat = Math.round(subtotal * 0.18);
                const total = subtotal + vat;
                
                // Create ESC/POS commands in new organized format
                let escposChunks = [];
                
                // Chunk 1: Header
                let chunk1 = "\x1B\x40"; // Initialize printer
                chunk1 += "\x1B\x61\x01"; // Center align
                chunk1 += "\x1B\x21\x10"; // Double height
                chunk1 += "WILL'S TECH STORE\n";
                chunk1 += "\x1B\x21\x00"; // Normal text
                chunk1 += "Tech Store & Services\n";
                chunk1 += "Kampala Road, Kampala\n";
                chunk1 += "Tel: +256 700 123 456\n";
                chunk1 += "\x1B\x2D\x01"; // Underline on
                chunk1 += "----------------\n";
                chunk1 += "\x1B\x2D\x00"; // Underline off
                chunk1 += "\x1B\x21\x10"; // Double height
                chunk1 += "SALES RECEIPT\n";
                chunk1 += "\x1B\x21\x00"; // Normal text
                chunk1 += "\x1B\x2D\x01"; // Underline on
                chunk1 += "----------------\n";
                chunk1 += "\x1B\x2D\x00"; // Underline off
                chunk1 += "\x1B\x61\x00"; // Left align
                
                // Receipt details
                chunk1 += `Date:    ${now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}\n`;
                chunk1 += `Time:    ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}\n`;
                chunk1 += `Receipt: ${receiptNumber}\n`;
                chunk1 += `Txn ID:  ${transactionId}\n`;
                chunk1 += `Customer:${document.getElementById('customerName').value || 'Walk-in Customer'}\n`;
                chunk1 += "----------------\n";
                
                escposChunks.push(chunk1);
                
                // Chunk 2: Items header
                let chunk2 = "\x1B\x21\x08"; // Bold
                chunk2 += "ITEM                QTY    AMOUNT\n";
                chunk2 += "\x1B\x21\x00"; // Normal
                chunk2 += "----------------\n";
                
                // Add items
                itemsToPrint.forEach(item => {
                    const name = item.name.substring(0, 18).padEnd(18, ' ');
                    const qty = item.quantity.toString().padStart(3, ' ');
                    const amount = formatUGX(item.total).padStart(10, ' ');
                    chunk2 += `${name} ${qty} ${amount}\n`;
                });
                
                escposChunks.push(chunk2);
                
                // Chunk 3: Totals and footer
                let chunk3 = "----------------\n";
                chunk3 += `Subtotal:       ${formatUGX(subtotal).padStart(10, ' ')}\n`;
                chunk3 += `VAT (18%):      ${formatUGX(vat).padStart(10, ' ')}\n`;
                chunk3 += "----------------\n";
                chunk3 += "\x1B\x21\x10"; // Double height for total
                chunk3 += `TOTAL:          ${formatUGX(total).padStart(10, ' ')}\n`;
                chunk3 += "\x1B\x21\x00"; // Normal
                chunk3 += "----------------\n";
                
                // Payment info
                chunk3 += `Payment: ${document.getElementById('paymentMethod').value}\n`;
                chunk3 += "\x1B\x61\x01"; // Center align
                chunk3 += "\x1B\x21\x08"; // Bold
                chunk3 += "✓ TRANSACTION SUCCESSFUL\n";
                chunk3 += "\x1B\x21\x00"; // Normal
                chunk3 += "THANK YOU FOR SHOPPING\n";
                chunk3 += "WITH US!\n";
                chunk3 += "\x1B\x21\x08"; // Bold
                chunk3 += "WILL'S TECH STORE\n";
                chunk3 += "\x1B\x21\x00"; // Normal
                chunk3 += "Tel: +256 700 123 456\n\n";
                
                // Footer
                chunk3 += "For inquiries call:\n";
                chunk3 += "+256 700 123 456\n";
                chunk3 += "Email: info@willstech.store\n";
                chunk3 += "Website: willstech.store\n";
                chunk3 += "*********************\n\n\n\n";
                
                // Add tear-off space
                chunk3 += "--- Tear here ---\n\n\n\n\n";
                
                chunk3 += "\x1D\x56\x41\x00"; // Partial cut (leaves paper for tearing)
                
                escposChunks.push(chunk3);
                
                // Ensure Bluetooth is connected
                if (!bluetoothDevice.gatt.connected) {
                    await bluetoothDevice.gatt.connect();
                }
                
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                const characteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
                
                const encoder = new TextEncoder();
                
                // Send chunks with small delay between them
                for (let i = 0; i < escposChunks.length; i++) {
                    const chunk = escposChunks[i];
                    console.log(`Sending chunk ${i + 1} of ${escposChunks.length}, size: ${chunk.length} bytes`);
                    
                    // Split further if chunk is still too large
                    if (chunk.length > 500) {
                        const subChunks = splitString(chunk, 400);
                        for (const subChunk of subChunks) {
                            await characteristic.writeValue(encoder.encode(subChunk));
                            await sleep(50);
                        }
                    } else {
                        await characteristic.writeValue(encoder.encode(chunk));
                        if (i < escposChunks.length - 1) {
                            await sleep(50);
                        }
                    }
                }
                
                showToast('Receipt sent to Bluetooth printer!');
                
            } catch (error) {
                console.error('Bluetooth print error:', error);
                showToast('Bluetooth printing failed: ' + error.message, 'error');
            }
        }
        
        // Helper function to split string into chunks
        function splitString(str, maxLength) {
            const chunks = [];
            for (let i = 0; i < str.length; i += maxLength) {
                chunks.push(str.substring(i, i + maxLength));
            }
            return chunks;
        }
        
        // Helper function for delay
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
