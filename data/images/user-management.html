<!-- user-management.html -->
<!DOCTYPE html>
<html>
<head>
    <title>User Management</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; }
        .user { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
        .admin { background: #e3f2fd; }
        .field-team { background: #f1f8e9; }
    </style>
</head>
<body>
    <h1>User Management</h1>
    
    <div id="login">
        <h3>Admin Login</h3>
        <input id="email" type="email" placeholder="Admin Email">
        <input id="password" type="password" placeholder="Admin Password">
        <button onclick="login()">Login</button>
    </div>
    
    <div id="management" style="display: none;">
        <h3>Add New User</h3>
        <input id="newEmail" type="email" placeholder="User Email">
        <input id="newPassword" type="password" placeholder="Password">
        <select id="newRole">
            <option value="field_team">Field Team</option>
            <option value="admin">Admin</option>
        </select>
        <button onclick="createUser()">Create User</button>
        
        <h3>Existing Users</h3>
        <div id="usersList"></div>
    </div>
    
    <script>
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                document.getElementById('login').style.display = 'none';
                document.getElementById('management').style.display = 'block';
                loadUsers();
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        }
        
        async function createUser() {
            const email = document.getElementById('newEmail').value;
            const password = document.getElementById('newPassword').value;
            const role = document.getElementById('newRole').value;
            
            try {
                // Create user in Authentication
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Create user document in Firestore
                await db.collection('users').doc(user.uid).set({
                    email: email,
                    role: role,
                    createdAt: new Date()
                });
                
                alert('User created successfully!');
                loadUsers();
                
                // Clear form
                document.getElementById('newEmail').value = '';
                document.getElementById('newPassword').value = '';
            } catch (error) {
                alert('Error creating user: ' + error.message);
            }
        }
        
        async function loadUsers() {
            const usersSnapshot = await db.collection('users').get();
            let html = '';
            
            usersSnapshot.forEach(doc => {
                const user = doc.data();
                html += `
                    <div class="user ${user.role}">
                        <strong>${user.email}</strong><br>
                        Role: ${user.role}<br>
                        UID: ${doc.id}
                    </div>
                `;
            });
            
            document.getElementById('usersList').innerHTML = html;
        }
    </script>
</body>
</html>
